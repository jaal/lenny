<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- A widget surface, not a page anyone should reach from a search result. -->
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<!-- Vivaldi prints <title> as the widget card's own title line, above the web
     view. It is rewritten with the number as soon as the badge lands, but it
     has to read well before that too. -->
<title>{% if since %}Days with ≥1 commit since {{ since }}{% else %}Days without missing a commit{% endif %} · @{{ username }}</title>
<!--
  lenny widget for Vivaldi.

  Added in Vivaldi as Dashboard → Add Widget → Webpage → this URL. What that
  gives us, and what it therefore has to survive:

  - The viewport is 394px wide and either ~155px (Regular) or ~380px (Tall)
    tall, toggled live from the widget's ⋯ menu. Both must work, and the page
    itself must never scroll.
  - Theme variables (--colorBg/--colorFg/--colorHighlightBg/--radius/
    --isDarkTheme) exist only when the user ticks "Share Theme Colors", so
    every use needs a fallback.
  - All dialogs and permission prompts are disabled inside a widget.
  - The page is NOT kept alive: Vivaldi closes it when the Dashboard closes and
    re-loads it on every open. Cold-start speed is the whole game — and this
    service naps on Render's free tier, where a cold badge takes ~30 s. Hence
    paint-from-localStorage-first, plus the fetch limits documented above
    readCache(): one request a day in the normal case, a lease so overlapping
    Dashboard opens cannot stack requests, and a cooldown after failures.
  - A plain left-click on target="_blank" is unreliable in a widget, so the
    click handler falls back to navigating the widget itself.

  No analytics run here: the backend already tags the badge fetch with
  source=widget, which is enough, and a consent banner does not fit in 155px.
-->
<style>
  :root {
    --bg: var(--colorBg, #fdfdfc);
    --fg: var(--colorFg, #1c232a);
    --accent: var(--colorHighlightBg, #057DFF);
    --r: var(--radius, 8px);
  }
  /* Secondary text is mixed from the theme's own fg/bg, not a fixed grey: a
     Vivaldi theme background can be any colour, and fixed rgba() over a
     mid-tone theme drops the 10.5px footer below readable contrast. */
  :root { --muted: color-mix(in srgb, var(--fg) 62%, var(--bg)); }
  @media (prefers-color-scheme: dark) {
    :root { --bg: var(--colorBg, #14161c); --fg: var(--colorFg, #e9e9f0); }
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    overflow: hidden;                    /* a widget must never scroll */
  }
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { height: 100%; display: flex; flex-direction: column;
          padding: 5px 8px 3px; gap: 3px; }

  /* The header only earns its space in Tall; Regular gives the sign the lot. */
  .head { display: none; flex: none; align-items: baseline; gap: 6px;
          font-size: 12px; white-space: nowrap; overflow: hidden; }
  .head .who { font-weight: 650; overflow: hidden; text-overflow: ellipsis; }
  .head .since { color: var(--muted); font-size: 11px; flex: none; }
  @media (min-height: 220px) { .head { display: flex; } }

  /* The sign is one big link — a small icon would be hard to hit in a 155px
     widget, and the click-out is the only way from here back to the source. */
  a.open {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 2px; border-radius: var(--r);
    color: inherit; text-decoration: none;
  }
  a.open:hover { background: color-mix(in srgb, var(--fg) 7%, var(--bg)); }
  a.open:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* The badge is 619x403, so at 394px wide it wants 256px of height — more than
     Regular has. Letterboxing it there leaves the sign small and marooned in the
     middle of the widget, so Regular crops instead: fill the width, and shift
     the crop up to 16% so the window lands on the number card and both caption
     lines (Lenny's legs are the only thing lost). Tall has the room for the
     whole picture, Lenny included, which is the joke — so it letterboxes. */
  img { width: 100%; height: 100%; display: block;
        object-fit: cover; object-position: center 16%;
        border-radius: calc(var(--r) - 2px); }
  @media (min-height: 220px) {
    img { object-fit: contain; object-position: center; }
  }

  /* Tall fits the badge at 394x256 in a ~330px box, so there is slack under it.
     A caption spends that on the number in text — which also survives a badge
     that never loads, and gives the sign a readable form for a screen reader. */
  .cap { display: none; flex: none; text-align: center; margin-top: 3px;
         font-size: 11.5px; color: var(--muted);
         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cap b { color: var(--fg); font-weight: 650; font-size: 13px; }
  @media (min-height: 220px) { .cap { display: block; } }

  .msg { text-align: center; padding: 0 10px; }
  .msg b { display: block; font-size: 12.5px; font-weight: 600; }
  .msg span { display: block; margin-top: 3px; font-size: 11px;
              color: var(--muted); line-height: 1.35; }

  .foot { flex: none; display: flex; align-items: center; gap: 5px;
          font-size: 10.5px; color: var(--muted);
          white-space: nowrap; overflow: hidden; }
  .foot .note { overflow: hidden; text-overflow: ellipsis; }
  .foot .sep { opacity: .5; flex: none; }
  .foot a { color: inherit; text-decoration: none; font-weight: 600;
            flex: none; margin-left: auto; }
  .foot a:hover { text-decoration: underline; }

  [hidden] { display: none !important; }
</style>

<div class="wrap">
  <div class="head">
    <span class="who">@{{ username }}</span>
    {% if since %}<span class="since">since {{ since }}</span>{% endif %}
  </div>

  <a class="open" id="open" href="https://github.com/{{ username }}"
     target="_blank" rel="noopener noreferrer">
    <img id="sign" alt="{{ username }}'s commit streak on the Lenny sign" hidden>
    <div class="msg" id="msg">
      <b id="msgTitle">Drawing the sign…</b>
      <span id="msgBody">First load can take ~30 s if the machine was napping.</span>
    </div>
  </a>

  <div class="cap" id="cap" hidden><b id="capN"></b> <span id="capT"></span></div>

  <div class="foot">
    <span class="note" id="note"></span>
    <a id="home" href="#">lenny</a>
  </div>
</div>

<script>
const USER = {{ username|tojson }};
const FROM = {{ since|tojson }};
const HAND = {{ hand|tojson }};

const $ = id => document.getElementById(id);
const img = $('sign'), msg = $('msg');

// Works at the root (localhost:5001) and behind the olekwrites.com/lenny proxy
// alike: strip this page's own "/<user>/widget/vivaldi" tail to find the service.
const base = location.pathname.replace(/\/[^/]+\/widget\/vivaldi\/?$/, '');
const badgeUrl = location.origin + base + '/' + encodeURIComponent(USER) +
                 '?source=widget' + (FROM ? '&from=' + encodeURIComponent(FROM) : '') +
                 (HAND === 'prev' ? '&hand=prev' : '');
$('home').href = location.origin + base + '/';

const KEY = 'lenny_w_' + USER.toLowerCase() + '_' + (FROM || 'streak') +
            (HAND === 'prev' ? '_prev' : '');
const utcDay = () => new Date().toISOString().slice(0, 10);

function show(head, body) {
  $('msgTitle').textContent = head;
  $('msgBody').textContent = body || '';
  msg.hidden = false;
}

const WHAT = FROM ? 'with ≥1 commit since ' + FROM : 'without missing a commit';
const days = n => n + (n === 1 ? ' day' : ' days');

// "67 days without missing a commit · @jaal" — the widget card's title line.
// n is unknown until the badge lands, and the numberless form is the one the
// server rendered into <title>, so this stays readable either way.
function title(n) {
  return (n == null ? 'Days ' : days(n) + ' ') + WHAT + ' · @' + USER;
}

function paint(dataUrl, day, n) {
  img.src = dataUrl;
  img.alt = title(n);
  img.hidden = false;
  msg.hidden = true;
  if (n != null) {
    document.title = title(n);
    $('capN').textContent = days(n);
    $('capT').textContent = WHAT;
    $('cap').hidden = false;
  }
  // A day-old sign is still worth showing — it just says so.
  $('note').textContent = day === utcDay() ? '' : 'as of ' + day;
}

/* ── how often this is allowed to hit the server ────────────────────────────
   Vivaldi reloads the page on every Dashboard open, so a naive "fetch on load"
   means one request per open — dozens a day, against a free-tier box that takes
   ~30 s to wake up. Three rules hold it to roughly one request a day:

   1. Badge in hand and same UTC day → never fetch. The origin computes one
      badge per user per UTC day and then serves it frozen, so a same-day
      refetch would return byte-identical bytes. This is the main saving.
   2. Before fetching, claim a 2-minute lease on disk. Another Dashboard open is
      a brand-new page with no memory of this one, so localStorage is the only
      place it can learn a request is already in flight. Without this, opening
      and closing the Dashboard while the server wakes starts a fresh 90 s
      request every time.
   3. A failure sets a cooldown sized to the reason: minutes for something
      transient, hours for a username that does not exist (a typo will not fix
      itself), and until UTC midnight when the origin says its daily bandwidth
      budget is spent — which is exactly when it says it will be back.

   All three live in the same localStorage entry as the badge, because they have
   to survive the page being closed — which is the normal case here, not the
   exception. */
const LEASE_MS = 2 * 60 * 1000;
const COOLDOWN_MS = {
  offline: 5 * 60 * 1000,
  error: 5 * 60 * 1000,
  nouser: 6 * 60 * 60 * 1000,
};
function cooldownFor(why) {
  if (why !== 'budget') return COOLDOWN_MS[why] || COOLDOWN_MS.error;
  const n = new Date();   // the origin's own answer: back at UTC midnight
  return Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate() + 1) - n.getTime();
}

function readCache() {
  try { return JSON.parse(localStorage.getItem(KEY) || 'null') || null; }
  catch { return null; }
}

// Entries carry both the badge and the fetch limits, and either half can be
// written without the other — a cooldown must be recordable with no badge yet.
function patchCache(patch) {
  const entry = { ...(readCache() || {}), ...patch };
  writeCache(entry);
  return entry;
}

function writeCache(entry) {
  const put = () => localStorage.setItem(KEY, JSON.stringify(entry));
  try { put(); } catch {
    // Quota is shared with everything else on this origin. Drop other lenny
    // widgets' caches (a stale badge is cheap to re-fetch) and try once more.
    try {
      for (let i = localStorage.length - 1; i >= 0; i--) {
        const k = localStorage.key(i);
        if (k && k.startsWith('lenny_w_') && k !== KEY) localStorage.removeItem(k);
      }
      put();
    } catch { /* running without a usable store is fine, just slower */ }
  }
}

function fail(why) {
  patchCache({ nextTry: Date.now() + cooldownFor(why), why });
  return { ok: false, why };
}

async function refresh() {
  // The lease goes down BEFORE the request, not after: a Dashboard that is
  // opened, closed and reopened during a cold start would otherwise pile up
  // one 90 s request per open, and none of those pages can see each other.
  patchCache({ nextTry: Date.now() + LEASE_MS, why: null });

  // 90 s: the fetch has to outlive a Render cold start, or it would abort
  // exactly the request that ends one.
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 90000);
  let r;
  try {
    r = await fetch(badgeUrl, { cache: 'no-store', signal: ctl.signal });
  } catch {
    return fail('offline');
  } finally { clearTimeout(t); }

  if (!r.ok) return fail(r.status === 404 ? 'nouser'
                       : r.status === 429 ? 'budget' : 'error');
  // Same origin, so every response header is readable: the count rides along
  // with the picture instead of costing a second request.
  const n = parseInt(r.headers.get('X-Lenny-Count'), 10);
  const blob = await r.blob();
  const data = await new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = rej;
    fr.readAsDataURL(blob);
  });
  const entry = patchCache({ day: utcDay(), data, n: isFinite(n) ? n : null,
                             at: Date.now(), nextTry: 0, why: null });
  paint(entry.data, entry.day, entry.n);
  return { ok: true };
}

const FAIL = {
  nouser: ['No such GitHub user', 'Check the username in the widget URL.'],
  budget: ['Badge paused', "Today's bandwidth budget is spent. Back at UTC midnight."],
  offline: ["Couldn't reach lenny", 'It may still be waking up — reopen the Dashboard.'],
  error:  ["Couldn't draw the sign", 'Something went wrong on the way. Try again later.'],
};

// The single gate every fetch goes through, so the load path and the midnight
// tick cannot disagree about when the server may be touched.
function blockedReason(c) {
  if (!c) return null;
  if (c.nextTry && Date.now() < c.nextTry) return 'cooling';
  if (c.data && c.day === utcDay()) return 'fresh';
  return null;
}

let lastDay = utcDay();

(async function load() {
  const cached = readCache();
  if (cached && cached.data) paint(cached.data, cached.day, cached.n);

  const blocked = blockedReason(cached);
  if (blocked) {
    // Nothing to show and not allowed to ask: say which, rather than sitting on
    // "Drawing the sign…" forever. A live lease really is still drawing, so
    // that default message is the right one to leave alone.
    if (!(cached && cached.data) && cached.why) show(...FAIL[cached.why]);
    return;
  }

  const res = await refresh();
  if (res.ok) return;
  if (cached && cached.data) $('note').textContent = 'as of ' + cached.day;
  else show(...FAIL[res.why]);
})();

// The Dashboard can sit open across UTC midnight, when the number can change.
setInterval(() => {
  const d = utcDay();
  if (d === lastDay) return;
  lastDay = d;
  if (!blockedReason(readCache())) refresh();
}, 300000);

// A plain left-click on target="_blank" does not reliably open in a Vivaldi
// widget. Try a new tab, and fall back to navigating the widget itself so the
// click always does something.
$('open').addEventListener('click', e => {
  const url = $('open').href;
  if (!url) return;
  e.preventDefault();
  let w = null;
  try { w = window.open(url, '_blank', 'noopener'); } catch {}
  if (!w) { try { location.href = url; } catch {} }
});
</script>
</html>
